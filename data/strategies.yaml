        icon: "🏦"

  # ─────────────────────────────────────────────────────────────────
  - slug: tier-c-cash-buyer
    emoji: "💵"
    title: "Tier C — Cash Buyer (no seller finance)"
    tier_badge: "tier-c"
    tldr: >
      SFH that already cash-flows at retail. DO NOT pitch seller finance —
      Richard explicit: "Strong cash-flowing deals usually don't need seller
      financing." Submit cash offer at 70–80% of asking via Grand In Taylor.
    when:
      - "Property type: SFH"
      - "Already cash-flows for a cash buyer at full ask (CF > $200/mo)"
      - "DOM: 60+ days"
      - "Strategy: wholesale at a cash discount, NOT creative finance"
    how_to:
      - title: "Confirm Tier C — cash-flow check"
        detail: "Does this SFH cash-flow at asking? If yes, you do NOT pitch seller finance. If it only works with seller finance, it's actually Tier A or B."
      - title: "Calculate Max Allowable Offer"
        detail: "MAO = 70-80% of asking price (depends on market and rehab). Use Fix & Flip Calculator if condition needs work."
        link: { label: "Fix & Flip Calculator", url: "https://www.hmhw.group/tools/fix-and-flip", external: true }
      - title: "Find motivation BEFORE offering"
        detail: "Tier C only works with motivated sellers. Ask: divorce, inheritance, tired landlord, job relocation? No motivation = pass."
      - title: "First contact — qualify, don't pitch"
        detail: "Use the C1 script below. Ask about flexibility on price. Listen for motivation signals."
      - title: "Submit cash offer at MAO"
        detail: "Send written offer at 70-80% of asking. Include 10 biz day inspection, $1K EMD after inspection."
      - title: "On verbal yes → contract"
        detail: "Standard cash contract (not creative addendum)."
        command:
          text: "verbal yes on [address] (cash)"
          label: "Trigger: cash contract parameters"
          hint: "Append \"(cash)\" so Claude knows to use the cash template."
      - title: "Submit dispo via Cash Alt form"
        detail: "Use Grand In Taylor CASH Alt form (NOT Creative form). BBC Marketplace also auto-dispos."
        link: { label: "Grand In Taylor Cash Alt Form", url: "https://grandintaylorllc.salesmate.io/webforms/#/696ce9d7-457b-44ad-8e6f-a9574197e587", external: true }
      - title: "If cash rejected — pivot to seller finance"
        detail: "If seller won't take cash discount, try Tier A or B structure. The pivot recording (Pitch 29) shows how Richard transitions."
    voicemail:
      script_section: "outreach-scripts.md#tier-c1"
      audio_file_path: "3d3cf27d-39be-4078-813b-1edb74d381da/1777608335336-12.mp3"
      audio_title: "Pitch 29 - Cash & Seller Finance (pivot example)"
      duration: "3:14"
    counter_rules:
      - text: "If seller refuses to negotiate to 70–80%, pivot to Tier A/B seller-finance offer (if structure fits)."
      - text: "Seller motivation matters here more than price — divorces, inherited, tired landlords are best."
      - text: "Submit via Grand In Taylor Cash Alt form, not Creative form."
    sources:
      - label: "HMHW Cash Course (Section 8 + Fix&Flip)"
        url_key: "hmhw_cash_course"
        icon: "📚"
      - label: "Grand In Taylor Cash Alt form"
        url_key: "git_cash_form"
        icon: "📤"
