sops:

  # ─────────────────────────────────────────────────────────────────
  - slug: setup-bbc-autosearch
    emoji: "⚡"
    title: "One-Time Setup — BBC Auto-Search"
    tldr: >
      Install Tampermonkey + one userscript so every "Search BBC ↗" link
      on daily-brief deal cards auto-fills BBC's search and runs it. Two
      minutes, do once per device.
    when:
      - "First-time setup, on each browser you use (laptop primary; phone optional)"
      - "After install: any 'Search BBC ↗' link from the briefing auto-runs"
      - "Without it, the BBC link just lands on Lightning Leads — you paste the address manually"
    how_to:
      - title: "Install Tampermonkey browser extension"
        detail: "Tampermonkey is a free, well-known browser extension that runs user-supplied scripts on specific sites. Chrome/Edge/Safari/Firefox supported."
        link: { label: "tampermonkey.net (pick your browser)", url: "https://www.tampermonkey.net/", external: true }
      - title: "Pin Tampermonkey to the toolbar (optional)"
        detail: "Click the puzzle-piece icon → pin Tampermonkey. Makes it visible so you know it's running."
      - title: "Install the BBC Auto-Search userscript"
        detail: "Click below — Tampermonkey will open with the script source and an Install button. Click Install."
        link: { label: "Install BBC Auto-Search userscript ↗", url: "https://raw.githubusercontent.com/timfarr-ai/rt-companion/main/scripts/bbc-autosearch.user.js", external: true }
      - title: "Install the Offer Oven Prefill userscript"
        detail: "Same flow — opens Tampermonkey with the prefill script. Click Install. Powers the 'Verify in Offer Oven ↗' link on every Tier A/B card — auto-fills price/down/rate/term/balloon/rent/assignment/closing into Offer Oven."
        link: { label: "Install Offer Oven Prefill userscript ↗", url: "https://raw.githubusercontent.com/timfarr-ai/rt-companion/main/scripts/offer-oven-prefill.user.js", external: true }
      - title: "Confirm both installs"
        detail: "Open Tampermonkey dashboard — you should see TWO enabled scripts: 'BBC Lightning Leads — Auto-Search from URL hash' and 'HMHW Offer Oven — Prefill from briefing'. Both auto-update from the same URLs whenever I push changes — no re-install needed."
      - title: "Test BBC auto-search"
        detail: "Open the dashboard. Tap any 'Search BBC ↗' link on a deal card → BBC opens with city/state pre-typed and Search auto-runs. Green '🔍 Auto-searched' banner top-right confirms."
        link: { label: "Open today's briefing", url: "/rt-companion/", external: false }
      - title: "Test Offer Oven prefill"
        detail: "Tap 'Verify in Offer Oven ↗' on any Tier A or Tier B card → Offer Oven opens, fields auto-fill with the standard offer (Tier A: asking+10%, 10% down; Tier B: asking+20%, 12% down). Green '✓ Offer Oven prefilled' banner confirms which fields matched."
      - title: "Troubleshoot"
        detail: "Doesn't run? (a) confirm you're logged into BBC first; (b) Tampermonkey toolbar icon should be colored not gray (= active); (c) check the script is enabled in Tampermonkey dashboard. If BBC redesigns and the selector breaks, the script shows '⚠️ search box not found' — message me to update."
      - title: "What it does NOT do (yet)"
        detail: "It only auto-fills the search. Agent contact unlock still requires BBC 'cookies' (~$0.50/unlock per property) — tap the listing in BBC and click 'Unlock contact'. Future enhancement could auto-unlock Tier A deals during triage when Tim has cookie balance > 0."
    counter_rules:
      - text: "Search uses city + state, not full street — BBC's search works best at metro level. Tim's eye scans the result list for the address."
      - text: "Userscript version-pinned to the GitHub raw URL — auto-updates on every push to main."
      - text: "Privacy: the script only runs on buyboxcartel.com/vip/lightning-leads. It can't see any other site or your data."
    sources:
      - label: "Tampermonkey FAQ"
        url: "https://www.tampermonkey.net/faq.php"
        icon: "❓"
      - label: "Userscript source (review before install)"
        url: "https://github.com/timfarr-ai/rt-companion/blob/main/scripts/bbc-autosearch.user.js"
        icon: "📄"

  # ─────────────────────────────────────────────────────────────────
  - slug: deal-lifecycle
    emoji: "🔄"
    title: "Deal Lifecycle — Where Each Deal Lives"
    tldr: >
      The daily briefing is INBOX. BBC Inventory is PIPELINE. Airtable Watchlist
      is COLD-WATCH. Each deal has one canonical home at each stage.
    when:
      - "Before working any deal — understand where to track its state"
      - "Confused about whether to use BBC, Airtable, or somewhere else"
    how_to:
      - title: "Stage 0 — Briefing INBOX (8am each weekday)"
        detail: "Daily briefing on the dashboard. Ephemeral — refreshed each morning. Don't track state here; this is just what's NEW today. <strong>Action: scan and decide which deals to act on.</strong>"
        link: { label: "Today's briefing", url: "/rt-companion/", external: false }
      - title: "Stage 1 — First call → BBC Inventory"
        detail: "The moment you dial an agent (even a voicemail), move that deal into <strong>BBC Inventory</strong> at Stage 1 (Prospecting). Use BBC's notes field to log: date called, voicemail or live, agent name, agent phone. This is the canonical pipeline."
        link: { label: "BBC Inventory", url: "https://buyboxcartel.com/vip/inventory", external: true }
      - title: "Stage 2 — Offer sent → BBC Inventory advance"
        detail: "Once you submit a written offer through BBC, advance the card from Prospecting → Offer Sent. BBC tracks the contract state from here."
      - title: "Stage 3 — Under contract → BBC Inventory + start dispo"
        detail: "Contract executed. Move to Under Contract stage. Trigger one-pager generation and submit to dispo channels (see Verbal Yes → Dispo SOP)."
      - title: "Stage 4 — Closed / assigned"
        detail: "Final stage. Log final assignment fee. Add buyer to Airtable Known Buyers if they're a new contact worth keeping for future deals."
      - title: "REJECTED deals → Airtable Rejected Watchlist (passive)"
        detail: "Deals from the briefing that didn't qualify (CF<$200 or wrong tier) auto-push to <strong>Airtable Watchlist</strong>. Deal Monitor checks them every 48h for price drops. <strong>Action: nothing — it's automated.</strong>"
        link: { label: "Airtable Watchlist", url: "https://airtable.com/appv6jhEzhGaAITcs/tbluV0qAWYNAFkD5S", external: true }
      - title: "DEAD deals (after 90 days no movement) → archive"
        detail: "BBC Inventory cards that stale at Prospecting for 90+ days with no agent response → archive in BBC. Don't keep dead leads cluttering the active view."
    counter_rules:
      - text: "DO NOT track active pipeline in Airtable. Airtable is for (a) Known Buyers (your network) and (b) Rejected Watchlist (price-drop monitoring). NOT pipeline."
      - text: "DO NOT track briefing-only deals — the briefing refreshes every morning. If a deal matters, move it to BBC Inventory immediately."
      - text: "DO use BBC Inventory notes liberally — agent names, call dates, response patterns all live there."
      - text: "If a Watchlist deal goes 'Newly Qualified' (Deal Monitor flags it), move it to BBC Inventory Stage 1 manually."
    sources:
      - label: "BBC Inventory (canonical pipeline)"
        url_key: "bbc_inventory"
        icon: "🏦"
      - label: "Airtable Watchlist (passive monitoring)"
        url: "https://airtable.com/appv6jhEzhGaAITcs/tbluV0qAWYNAFkD5S"
        icon: "📒"
      - label: "Airtable Known Buyers (your network)"
        url: "https://airtable.com/appv6jhEzhGaAITcs/tblh40Mq2rHwfe1I2"
        icon: "👥"

  # ─────────────────────────────────────────────────────────────────
  - slug: morning-triage
    emoji: "🌅"
    title: "Morning Triage Review (8am)"
    tldr: >
      Each weekday at 6am AEST the cloud routine pushes a tier-organized
      briefing to the dashboard. This SOP is how you scan it in <10 min
      and set your call list for the day.
    when:
      - "Every weekday morning before any deal work"
      - "Briefing arrives ~6:05am AEST after cloud routine runs"
    how_to:
      - title: "Open the dashboard on phone or laptop"
        detail: "Bookmark already on home screen. Tap to open."
        link: { label: "Open dashboard", url: "https://timfarr-ai.github.io/rt-companion/", external: true }
      - title: "Filter out RELISTED/PAUSED listings FIRST"
        detail: "Look for the red ⚠ RELISTED or amber ⚠ Paused status pill on each card. RELISTED = the listing has a gap between days-on-market and total-days-listed, which strongly suggests it went under contract previously (or is right now). Click 'Zillow ↗ (agent here)' to verify current status. Skip listings that show 'Active Under Contract' or 'Pending' on Zillow — the agent is busy with the in-contract buyer and your call is low priority. <strong>Only call ✓ Active listings.</strong>"
      - title: "Read Tier A deals first (top priority)"
        detail: "Tier A = MFH 5+ units $350K-$1.4M, DOM 90+. These have the highest assignment fee potential ($50K+). Cap your morning call list at 2-3 Tier A deals."
      - title: "Then Tier B (cheap stale SFH)"
        detail: "Lower-effort calls. Aim for 3-5 Tier B voicemails in a single sitting."
      - title: "Tier C (cash buyer SFH) — only if quota for the week is light"
        detail: "Cash offers are lower yield. Skip if Tier A/B fills your block."
      - title: "Copy each script before dialing"
        detail: "Tap the deal → Tier playbook → 'Copy script' button. Paste into Notes app for during-call reference."
      - title: "Find agent phone numbers via Zillow"
        detail: "Tap the Zillow link on each briefing card → agent name → cell phone. Save to your call list."
      - title: "Skip data-incomplete deals for now"
        detail: "Deals with missing rent/PITI need Zillow or Rentometer enrichment. Park them for a 'data cleanup' block later in the day."
    sources:
      - label: "Open today's briefing"
        url: "https://timfarr-ai.github.io/rt-companion/briefings/latest.html"
        icon: "📋"
      - label: "Past briefings archive"
        url: "https://timfarr-ai.github.io/rt-companion/briefings/"
        icon: "📚"
      - label: "Cloud routine logs (claude.ai)"
        url: "https://claude.ai/code/routines/trig_01DXdZ22PfZsyJjmTkiWPanC"
        icon: "🤖"
      - label: "BBC Lightning Leads (manual browse)"
        url_key: "bbc_lightning"
        icon: "🏦"

  # ─────────────────────────────────────────────────────────────────
  - slug: call-block
    emoji: "📞"
    title: "Outreach Call Block"
    tldr: >
      Working through your daily call list. Goal: 10 voicemails + 2-3
      live conversations per 60-min block. Voicemail is the pitch — not
      a callback request.
    when:
      - "After the morning triage; ideal time: 10am-noon local time of target market"
      - "Tier A deals: 9am-5pm local for the agent's brokerage"
      - "Don't call after 5pm — agents are with clients"
    how_to:
      - title: "Set up: phone, Notes app, dashboard"
        detail: "Open the matching tier playbook in dashboard. Have Notes app ready for callbacks and follow-up notes."
      - title: "Dial the first deal"
        detail: "Use OpenPhone or Google Voice if you have a US line. Otherwise, mark calls as 'unknown number' — agents callback rate ~10-20% from voicemail."
      - title: "If voicemail — leave the FULL voicemail script"
        detail: "Don't shorten. The voicemail IS the pitch. Capital gains frame for Tier A, 'I negotiate backwards' frame for Tier B."
      - title: "If they answer — use the live call script"
        detail: "Open the matching tier playbook → Live Call section. Walk through DSCR math for Tier A. Confirm condition + motivation for B/C."
      - title: "End every call with a hook"
        detail: "Live: <em>'Can you present that to your seller this week?'</em><br>Voicemail: <em>'I'll also shoot you a text.'</em> (then send a 1-line text with your callback number)."
      - title: "Track every call in a single doc"
        detail: "After each call, note: address, agent name, voicemail or live, response, follow-up date. Use Airtable Known Buyers table once set up."
      - title: "Follow-up cadence"
        detail: "No callback after 48h → second dial. No response after 5 days → text. No response after 10 days → mark as 'cold' and move to watchlist."
    sources:
      - label: "Tier A playbook"
        url: "/rt-companion/strategy/tier-a-multifamily-checkmate.html"
        icon: "🎯"
      - label: "Tier B playbook"
        url: "/rt-companion/strategy/tier-b-cheap-sfh-stale.html"
        icon: "🏘️"
      - label: "Objection handling"
        url: "/rt-companion/strategy/objections.html"
        icon: "🛡️"

  # ─────────────────────────────────────────────────────────────────
  - slug: agent-reply
    emoji: "✉️"
    title: "Agent Replied — Counter Analysis"
    tldr: >
      When an agent texts, emails, or calls back with new terms, route
      the message through Claude Code to get an instant counter analysis
      and response script. Don't reply blind.
    when:
      - "Agent texts/emails you with seller's counter terms"
      - "Agent leaves a voicemail with a partial counter"
      - "You need to know if the counter still pencils before responding"
    how_to:
      - title: "Capture the agent's exact words"
        detail: "Copy the text/email verbatim. For voicemail, type out what they said."
      - title: "In Claude Code on Mac OR claude.ai iOS app — paste this trigger with the agent's message:"
        detail: "Claude pulls the deal from context (or asks for the address), reparses the proposed terms, and runs the math."
        command:
          text: |-
            agent replied: "We'd accept your offer but seller wants 15% down instead of 10%."
          rows: 2
          label: "Trigger: counter-offer analysis"
          hint: "Replace the quoted message with what the agent actually said."
      - title: "Review Claude's analysis"
        detail: "You'll see: revised CF, revised CoC, whether deal still qualifies, recommendation (PROCEED / COUNTER BACK / KILL), and a response script."
      - title: "Apply Tier-specific rules before agreeing"
        detail: "Tier A: NEVER exceed 10% down. Never give both premium AND interest. Push back firmly on these even if Claude approves CF-wise.<br>Tier B: 12-14% down is OK. Interest at 4-6.5% is OK if price drops to asking."
      - title: "Send response"
        detail: "Copy Claude's response script. Customize 1-2 phrases to sound human. Send via the same channel the agent used (text → text, email → email)."
      - title: "Log the round"
        detail: "Save the agent's message + your response in Notes/Airtable so you can reconstruct the negotiation history."
      - title: "If COUNTER BACK — schedule follow-up"
        detail: "Most counters take 24-48 hours to resolve. Set a calendar reminder for 48h to check status."
    sources:
      - label: "Objection handling playbook"
        url: "/rt-companion/strategy/objections.html"
        icon: "🛡️"
      - label: "Tier A counter rules"
        url: "/rt-companion/strategy/tier-a-multifamily-checkmate.html#counter"
        icon: "🎯"

  # ─────────────────────────────────────────────────────────────────
  - slug: verbal-yes-to-dispo
    emoji: "✅"
    title: "Verbal Yes → Contract → Dispo"
    tldr: >
      The agent or seller has said yes. You now have ~30 days to close.
      This SOP is the exact sequence from verbal yes to dispo'd buyer.
    when:
      - "Agent calls/texts: 'Seller agreed to your terms'"
      - "You have all four key numbers: price, down, balloon, closing date"
    how_to:
      - title: "Generate contract parameters"
        detail: "Returns the full BBC data entry block + addendum language + buyer dispo summary."
        command:
          text: "verbal yes on 1915 Margalene Way, Austin TX"
          label: "Trigger: contract parameters"
          hint: "Replace with your deal's address."
      - title: "Enter in BBC → Create Offer"
        detail: "Open BBC Inventory → Create Offer. Fill the data block from Claude's output. Save the offer."
        link: { label: "BBC Inventory", url: "https://buyboxcartel.com/vip/inventory", external: true }
      - title: "Paste the addendum language"
        detail: "Copy from Claude's output into the BBC contract template. Customize address, dates, amounts."
      - title: "Send to agent for execution"
        detail: "BBC handles e-signature flow. Agent forwards to seller. Expect 24-72 hours for return."
      - title: "Start dispo immediately — don't wait"
        detail: "The moment offer is sent, start marketing. Time matters."
      - title: "Generate buyer one-pager"
        detail: "Returns a public URL you can DM to out-of-network buyers (Instagram, FB, personal email)."
        command:
          text: "generate buyer one-pager for 1915 Margalene Way, Austin TX"
          label: "Trigger: buyer one-pager"
          hint: "URL is shareable; no login required for the buyer."
      - title: "Submit to BBC Marketplace"
        detail: "BBC Marketplace auto-dispos to BBC's curated buyer network."
        link: { label: "BBC Marketplace", url: "https://buyboxcartel.com/vip/marketplace", external: true }
      - title: "Submit to Grand In Taylor LLC"
        detail: "Creative form for seller finance / sub-to. Cash Alt form for cash deals."
        link: { label: "Grand In Taylor Creative", url: "https://grandintaylorllc.salesmate.io/webforms/#/5bddb679-43e9-4a91-aca2-ddaff898ff78", external: true }
      - title: "DM the buyer one-pager URL to known buyers"
        detail: "Once Airtable Known Buyers exists, filter to buyers matching state + entry budget + deal type, then DM each."
      - title: "EMD timing — DO NOT submit early"
        detail: "EMD ($1,000) submitted ONLY AFTER inspection period ends. Inspection is 10 biz days (min 7). Richard's company often covers EMD."
      - title: "Move BBC card to 'Under Contract' stage"
        detail: "Track in BBC Inventory pipeline. Update status as inspection passes, EMD submitted, closing scheduled."
      - title: "Close in 30 days from execution"
        detail: "Title transfer at closing. If Land Trust structure, Buyer named as beneficiary."
    sources:
      - label: "Contract & Close playbook (addendum language)"
        url: "/rt-companion/strategy/contract-close.html"
        icon: "📝"
      - label: "BBC Inventory"
        url_key: "bbc_inventory"
        icon: "🏦"
      - label: "Grand In Taylor Creative Form"
        url_key: "git_creative_form"
        icon: "📤"
      - label: "Grand In Taylor Cash Alt Form"
        url_key: "git_cash_form"
        icon: "📤"

  # ─────────────────────────────────────────────────────────────────
  - slug: weekly-review
    emoji: "📅"
    title: "Weekly Pipeline Review (Friday)"
    tldr: >
      End-of-week sweep. Catch verbal-yeses not yet under contract,
      review watchlist for price drops, refresh buyer criteria, plan
      next week's call list.
    when:
      - "Every Friday afternoon, ~2pm"
      - "Before logging off for the weekend"
    how_to:
      - title: "Review BBC Inventory pipeline"
        detail: "Open BBC Inventory. For each card, confirm: status accurate? Inspection started? EMD timeline correct? Push verbal-yeses that haven't moved to under-contract."
        link: { label: "BBC Inventory", url: "https://buyboxcartel.com/vip/inventory", external: true }
      - title: "Check the rejected watchlist for price drops"
        detail: "Runs the Deal Monitor against the Airtable watchlist (it also auto-runs every 48h)."
        command:
          text: "check price drops"
          label: "Trigger: deal monitor"
          hint: "Manual trigger — supplements the auto 48h run."
      - title: "Review past week's call log"
        detail: "Open your Notes/Airtable call log. For every call from this week, mark: replied / no-response / dead. Move dead ones to watchlist."
      - title: "Refresh Known Buyers list"
        detail: "Open Airtable Known Buyers (when set up). For each active buyer, confirm: state, entry budget, deal type, last contact. Re-engage anyone silent >30 days."
      - title: "Plan next week's call list"
        detail: "Look at Monday's expected triage tier distribution. Schedule 2-3 call blocks across Tue/Wed/Thu. Pre-allocate 1 block per tier."
      - title: "Update Airtable + close out the week"
        detail: "Any deals not actively in pipeline: archive. Any open questions for Richard/HMHW community: queue for Monday's HMHW livestream Q&A."
    sources:
      - label: "BBC Inventory pipeline"
        url_key: "bbc_inventory"
        icon: "🏦"
      - label: "BBC Deal Checker (find buyers for active deals)"
        url_key: "bbc_dealchecker"
        icon: "🔍"
      - label: "HMHW Live Calls (Monday livestream)"
        url_key: "hmhw_education"
        icon: "🎙️"

strategies:

  # ─────────────────────────────────────────────────────────────────
  - slug: tier-a-multifamily-checkmate
    emoji: "🎯"
    title: "Tier A — Multifamily Checkmate"
    tier_badge: "tier-a"
    tldr: >
      MFH 5+ units, $350K–$1.4M, DOM 90+. DSCR loans fail at 7%+ rates,
      so seller finance is the only path. Every $50K+ assignment fee
      Richard has seen comes from this tier.
    when:
      - "Units: 5+ (multifamily required — FHA fails on 5+)"
      - "Price: $350K–$1.4M"
      - "DOM: 90+ days (the agent is now motivated)"
      - "Standard offer (asking + 10%, 10% down, 0%, 30yr) cash-flows positive"
      - "Down: 10% strict — never higher (kills end-buyer CoC)"
    how_to:
      - title: "Confirm the listing qualifies"
        detail: "From the morning briefing, verify: unit count ≥ 5, price $350K-$1.4M, DOM ≥ 90 days. If any miss, this isn't Tier A."
        link: { label: "Open BBC listing", url: "https://buyboxcartel.com/vip/lightning-leads", external: true }
      - title: "Verify the numbers — BBC's in-listing calculator first"
        detail: "Tap 'Search BBC ↗' on the briefing card → open the listing in BBC → use the <strong>built-in calculator</strong>. BBC auto-prefills the property data (taxes, insurance, rent, PITI, equity) so you only enter your offer terms. <strong>This is the canonical calculation</strong> — same engine that produced the briefing's CF number."
      - title: "Use Offer Oven for what-if scenario modeling"
        detail: "Offer Oven is the secondary tool — use when you want to model multiple offer structures side-by-side (e.g. 0%/+10% vs 5%/asking, or with/without balloon, or subject-to hybrid). It requires manual entry of every field. Best for deals NOT from BBC (off-market, referrals) where BBC's auto-prefill isn't available."
        link: { label: "Open Offer Oven", url: "https://www.hmhw.group/tools/offer-oven", external: true }
      - title: "Find the agent's direct number"
        detail: "Three paths: (a) if BBC cookies > 0 the agent name + phone are <strong>already in the briefing card</strong> (green box); (b) tap 'Zillow ↗ (agent here)' — Zillow shows the listing agent at the top of the listing page; (c) in BBC, tap the listing → 'Unlock contact' (costs 1 cookie ≈ $0.50)."
      - title: "Dial once — leave the voicemail (script below)"
        detail: "Don't expect an answer on first call. The voicemail is the pitch — it front-loads the math so the agent decides whether to engage before calling back."
      - title: "Wait 24-48 hours for callback"
        detail: "If no callback after 48 hrs, dial again. Don't text yet — first contact is voice."
      - title: "When they call back — run the live call script (below)"
        detail: "Walk through DSCR math: their P&I at 7.25% vs. rent. Make them see why no investor can buy this conventionally."
      - title: "Handle objections inline"
        detail: "When the agent pushes back, jump to the matching rebuttal below. Don't argue — read the rebuttal calmly."
      - title: "On verbal yes → generate contract"
        detail: "Returns the BBC data entry block + addendum language + dispo summary."
        command:
          text: "verbal yes on 1915 Margalene Way, Austin TX"
          label: "Trigger: contract parameters"
          hint: "Replace the address with your deal."
      - title: "Submit the deal"
        detail: "BBC Marketplace (auto-dispo to BBC buyers) + Grand In Taylor Creative Form. For non-BBC out-of-network buyers, generate a shareable one-pager URL:"
        command:
          text: "generate buyer one-pager for 1915 Margalene Way, Austin TX"
          label: "Trigger: buyer one-pager"
          hint: "Returns a public URL to DM out-of-network buyers."
        link: { label: "Grand In Taylor Creative Form", url: "https://grandintaylorllc.salesmate.io/webforms/#/5bddb679-43e9-4a91-aca2-ddaff898ff78", external: true }
